name: Build and dependency audit

on:
  pull_request:
    branches: [development]
  push:
    branches: [development]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check high/critical dependency advisories
        run: npm audit --audit-level=high
      - name: Build
        run: npm run build
